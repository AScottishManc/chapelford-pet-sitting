# Sections and rows of the price list on the Prices page.
# Names come from each service page; prices come from src/content/prices.yaml.
cats:
  heading: Cats
  order: 1
  rows:
    - service: feeding
      marker: "†"
      time: 15 mins
    - service: sitting
      time: 30 mins
  notes:
    - "† Only available within Chapelford and the immediate surrounding area."
dogs:
  heading: Dogs
  order: 2
  rows:
    - service: toilet
      marker: "†"
      time: 15 mins
    - service: home
      marker: "*"
      time: 30 mins
    - service: walking
      time: 30 mins
  notes:
    - "† Only available within Chapelford and the immediate surrounding area."
    - "* Half price if taken in conjunction with the walking service during the same visit."
other-pets:
  heading: Other Pets
  order: 3
  rows:
    - service: feeding
      marker: "†"
      time: 15 mins
    - service: home
      time: 30 mins
  notes:
    - "† Only available within Chapelford and the immediate surrounding area."
